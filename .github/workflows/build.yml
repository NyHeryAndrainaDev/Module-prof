          python3 - <<'PY'
          import wave, struct, math
          sr = 22050
          def tone(freq, dur, vol=0.9, decay=3.0):
              n = int(sr * dur); out = []
              for i in range(n):
                  t = i / sr
                  env = min(1, i / (sr * 0.005)) * math.exp(-decay * t / dur * 1.5)
                  v = math.sin(2*math.pi*freq*t) + 0.45*math.sin(2*math.pi*freq*2*t) + 0.2*math.sin(2*math.pi*freq*3*t)
                  out.append(vol * env * v / 1.65)
              return out
          def silence(d): return [0.0] * int(sr * d)
          seq = []
          for k in range(3):
              seq += tone(880, 0.38) + tone(1318.5, 0.38) + tone(1760, 0.55) + silence(0.35)
          w = wave.open("android/app/src/main/res/raw/alerte.wav", "wb")
          w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
          w.writeframes(b"".join(struct.pack("<h", int(max(-1, min(1, x)) * 32000)) for x in seq))
          w.close()
          PY
